<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco VXAS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Banco VXAS</h1>
    <form id="credit-form">
      <label for="nombre">Nombre del Solicitante:</label>
      <input type="text" id="nombre" placeholder="Ej. Valeria Ayala" required>

      <label for="edad">Edad:</label>
      <input type="number" id="edad" placeholder="Ej. 25" min="18" max="99" required>

      <label for="ingreso">Ingreso Mensual ($):</label>
      <input type="number" id="ingreso" placeholder="Ej. 15000" min="0" required>

      <label for="monto">Monto del Crédito Solicitado ($):</label>
      <input type="number" id="monto" placeholder="Ej. 150000" required>

      <label for="tasa">Tasa de Interés Anual Ordinaria (%):</label>
      <input type="number" id="tasa" placeholder="Ej. 34" step="0.1" required>

      <label for="plazo">Plazo del Financiamiento (Meses):</label>
      <select id="plazo">
        <option value="12">12 meses</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48" selected>48 meses</option>
      </select>

      <button type="button" id="btn-calcular">Calcular crédito</button>
      <button type="button" id="btn-limpiar">Limpiar campos</button>
    </form>

    <div id="resultado" class="resultado"></div>

    <h2>Tabla de Amortización</h2>
    <table id="tabla-amortizacion">
      <thead>
        <tr>
          <th>Periodo</th>
          <th>Saldo inicial</th>
          <th>Capital</th>
          <th>Interés</th>
          <th>IVA</th>
          <th>Pago total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
